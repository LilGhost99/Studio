<script>

  window.API_URL = 'https://script.google.com/macros/s/AKfycbziha3MpQawIRihZIXKaWHlpykMcY9iVqFj5O4ZMaTEeJjX6fEhWOt0UnrQIMetrZlo/exec';

  window.catalogRequest.catch(() => {});
</script>

<title>LilGhost Studio — Catálogo</title>

<style>
  .intro{position:relative; padding:0 0 30px;}
  .intro h1{font-size:clamp(48px,8vw,88px); margin-bottom:12px;}
  .intro .lead{margin:0;}
  .intro .hand{font-size:26px; color:var(--red); display:inline-block; transform:rotate(-3deg); margin-bottom:4px;}

  .filters{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:30px;}
  .filters button{
    padding:9px 18px;
    border:var(--border);
    border-radius:999px;
    background:var(--paper);
    color:var(--ink);
    font-family:inherit; font-size:14.5px; font-weight:700;
    box-shadow:var(--shadow-sm);
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
  }
  .filters button:hover{transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--ink);}
  .filters button.active{background:var(--ink); color:var(--on-ink);}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(250px,1fr));
    gap:28px 24px;
    margin-bottom:20px;
  }

  .product{
    position:relative;
    display:flex; flex-direction:column;
    background:var(--paper);
    border:var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .product:nth-child(3n+1){transform:rotate(-.8deg);}
  .product:nth-child(3n+2){transform:rotate(.6deg);}
  .product:hover{transform:translate(-3px,-3px) rotate(0); box-shadow:9px 9px 0 var(--ink);}

  .photo{
    aspect-ratio:4/3;
    background:var(--tint, #f3f3f3);
    color:var(--on-pastel);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .photo img{width:100%; height:100%; object-fit:cover; display:block;}
  .photo svg{width:48px; height:48px;}
  .product > .photo, .product > .gallery{border-bottom:var(--border);}

  .gallery{position:relative; aspect-ratio:4/3; min-height:0; overflow:hidden;}
  .slides{
    position:absolute; inset:0;
    display:flex;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .slides::-webkit-scrollbar{display:none;}
  .slides .photo{flex:0 0 100%; aspect-ratio:auto; scroll-snap-align:start;}
  .nav-btn{
    position:absolute; top:50%; transform:translateY(-50%);
    width:38px; height:38px; border-radius:50%;
    border:var(--border);
    background:var(--paper);
    color:var(--ink);
    font-size:22px; font-weight:700; line-height:1;
    display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow-sm);
    cursor:pointer;
    opacity:0;
    transition:opacity .2s ease;
  }
  .nav-btn.prev{left:10px;}
  .nav-btn.next{right:10px;}
  .gallery:hover .nav-btn, .nav-btn:focus-visible{opacity:1;}
  .nav-btn:disabled{visibility:hidden;}
  @media (hover:none){ .nav-btn{display:none;} }
  .dots{
    position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
    display:flex; gap:6px;
    padding:5px 8px;
    background:var(--paper);
    border:2px solid var(--ink);
    border-radius:999px;
    pointer-events:none;
  }
  .dots span{width:8px; height:8px; border-radius:50%; background:var(--dot-off); transition:background .2s ease;}
  .dots span.on{background:var(--ink);}

  .info{padding:18px 20px 20px; display:flex; flex-direction:column; gap:6px; flex:1;}
  .category{
    align-self:flex-start;
    font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    padding:3px 10px;
    border:2px solid var(--ink);
    border-radius:999px;
    background:var(--yellow-soft);
    color:var(--on-pastel);
  }
  .info h3{margin:2px 0 0; font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:21px; line-height:1.15;}
  .info p{margin:0; font-size:14.5px; line-height:1.5; color:var(--ink-soft);}
  .info .desc{
    white-space:pre-line;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .more{
    align-self:flex-start;
    margin-top:2px;
    font-size:14px; font-weight:700; color:var(--ink);
    text-decoration:underline; text-decoration-color:var(--yellow); text-decoration-thickness:3px; text-underline-offset:3px;
  }
  .more:hover{text-decoration-color:var(--ink);}
  .product{cursor:pointer;}
  .product-link{color:inherit; text-decoration:none;}
  .product-link:hover{text-decoration:underline; text-decoration-thickness:2px;}
  .info .price{margin-top:auto; padding-top:10px; font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:28px;}
  .info .price small{font-family:'DM Sans',sans-serif; font-size:13px; font-weight:700; color:var(--ink-soft);}

  .order{
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin-top:12px;
    padding:12px 14px;
    border:var(--border);
    border-radius:14px;
    background:var(--green);
    color:#fff;
    font-size:15px; font-weight:700;
    text-decoration:none;
    white-space:nowrap;
    box-shadow:var(--shadow-sm);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .order:hover{transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--ink);}
  .order:active{transform:translate(3px,3px); box-shadow:none;}
  .order svg{width:19px; height:19px;}
  .product.soldout .order{background:var(--paper); color:var(--ink);}

  .product.soldout .photo{filter:grayscale(1); opacity:.55;}
  .badge{
    position:absolute; top:14px; right:12px; z-index:2;
    font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:14px;
    padding:6px 14px;
    background:var(--red); color:#fff;
    border:var(--border);
    border-radius:8px;
    transform:rotate(6deg);
    box-shadow:var(--shadow-sm);
  }

  .message{
    grid-column:1/-1;
    padding:44px 20px;
    text-align:center;
    font-family:'Caveat',cursive; font-weight:700; font-size:28px;
    background:var(--paper);
    border:3px dashed var(--ink);
    border-radius:var(--radius);
  }
  .message img{display:block; width:70px; margin:0 auto 10px;}

  .loading{
    grid-column:1/-1;
    display:flex; align-items:center; justify-content:center; gap:14px;
    font-family:'Caveat',cursive; font-weight:700; font-size:30px;
  }
  .loading img{width:54px;}
  .loading .dots-anim::after{content:''; display:inline-block; width:1.2em; text-align:left; animation:dots 1.2s steps(4,end) infinite;}
  @keyframes dots{0%{content:'';} 25%{content:'.';} 50%{content:'..';} 75%,100%{content:'...';}}

  .skeleton{
    background:var(--paper);
    border:var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .skeleton:nth-child(3n+2){transform:rotate(-.8deg);}
  .skeleton:nth-child(3n+3){transform:rotate(.6deg);}
  .sk-photo{aspect-ratio:4/3; border-bottom:var(--border);}
  .sk-body{padding:18px 20px 22px;}
  .sk-line{height:14px; border-radius:7px; margin-bottom:12px;}
  .sk-pill{width:90px; height:20px; border-radius:999px; margin-bottom:14px;}
  .sk-btn{height:46px; border-radius:14px; margin-top:22px;}
  .sk-photo, .sk-line, .sk-pill, .sk-btn{
    background:linear-gradient(90deg, var(--sk1) 25%, var(--sk2) 50%, var(--sk1) 75%);
    background-size:200% 100%;
    animation:shimmer 1.2s linear infinite;
  }
  @keyframes shimmer{from{background-position:200% 0;} to{background-position:-200% 0;}}

  @media (prefers-reduced-motion: reduce){
    .product, .order, .filters button{transition:none;}
    .sk-photo, .sk-line, .sk-pill, .sk-btn, .loading .dots-anim::after{animation:none;}
  }
</style>
</head>
<body>

<script src="tienda.js"></script>
<script>
  // Esta página solo LEE el catálogo: no necesita clave y no puede modificar nada.
  let products = [];
  let activeCategory = '';

  function renderFilters(){
    const categories = [...new Set(products.map(p => String(p.category).trim()).filter(Boolean))];
    const box = document.getElementById('filters');
    if(categories.length < 2){ box.innerHTML = ''; return; }
    box.innerHTML = ['', ...categories].map(c =>
      `<button data-cat="${escapeHtml(c)}" class="${c === activeCategory ? 'active' : ''}">${c ? escapeHtml(c) : 'Todos'}</button>`
    ).join('');
    box.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
      activeCategory = btn.dataset.cat;
      renderFilters();
      renderGrid();
    }));
  }

  function imgTag(src, alt, eager){
    return `<img src="${escapeHtml(src)}" alt="${escapeHtml(alt)}" loading="${eager ? 'eager' : 'lazy'}" referrerpolicy="no-referrer">`;
  }

  function galleryHtml(p, eager){
    const photos = photosOf(p);
    if(photos.length === 0) return `<div class="photo">${PLACEHOLDER}</div>`;
    if(photos.length === 1) return `<div class="photo">${imgTag(photos[0], p.name, eager)}</div>`;
    return `
      <div class="gallery">
        <div class="slides">
          ${photos.map((src, i) => `<div class="photo">${imgTag(src, `${p.name} (foto ${i + 1} de ${photos.length})`, eager && i === 0)}</div>`).join('')}
        </div>
        <button class="nav-btn prev" aria-label="Foto anterior" disabled>&#8249;</button>
        <button class="nav-btn next" aria-label="Foto siguiente">&#8250;</button>
        <div class="dots">${photos.map((_, i) => `<span class="${i === 0 ? 'on' : ''}"></span>`).join('')}</div>
      </div>`;
  }

  function renderGrid(){
    const grid = document.getElementById('grid');
    const list = products.filter(p => !activeCategory || String(p.category).trim() === activeCategory);
    if(!list.length){
      grid.innerHTML = '<div class="message"><img src="img/fantasma.svg" alt="">Pronto agregaremos productos aquí.</div>';
      return;
    }
    grid.innerHTML = list.map((p, i) => `
      <article class="product ${p.available ? '' : 'soldout'}" style="--tint:${TINTS[i % TINTS.length]}" data-href="${escapeHtml(productUrl(p))}">
        ${p.available ? '' : '<div class="badge">Agotado</div>'}
        ${galleryHtml(p, i < 3)}
        <div class="info">
          ${p.category ? `<div class="category">${escapeHtml(p.category)}</div>` : ''}
          <h3><a class="product-link" href="${escapeHtml(productUrl(p))}">${escapeHtml(p.name)}</a></h3>
          ${p.description ? `<p class="desc">${escapeHtml(String(p.description).trim())}</p>` : ''}
          <a class="more" href="${escapeHtml(productUrl(p))}">Ver producto →</a>
          <div class="price">${formatPrice(p.price)}</div>
          <a class="order" href="${escapeHtml(orderLink(p))}" target="_blank" rel="noopener">
            ${WA_ICON}${p.available ? 'Pedir por WhatsApp' : 'Preguntar'}
          </a>
        </div>
      </article>
    `).join('');
    fallbackOnError(grid);
    grid.querySelectorAll('.gallery').forEach(g => setupGallery(g));
  }

  // Tocar cualquier parte de la tarjeta (menos botones y enlaces) abre el producto.
  document.getElementById('grid').addEventListener('click', e => {
    if(e.target.closest('a, button')) return;
    const card = e.target.closest('.product');
    if(card) location.href = card.dataset.href;
  });

  function show(data, final, changed){
    if(!changed) return;
    products = data;
    if(activeCategory && !products.some(p => String(p.category).trim() === activeCategory)) activeCategory = '';
    renderFilters();
    renderGrid();
  }

  loadProducts(show, () => {
    document.getElementById('grid').innerHTML =
      '<div class="message">No pudimos cargar el catálogo en este momento. Intenta de nuevo en unos minutos.</div>';
  });
</script>
