<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LilGhost Studio — Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

  :root{
    --navy: #0b1220;
    --violet: #5b21b6;
    --teal: #0891b2;
    --glass: rgba(255,255,255,0.09);
    --glass-border: rgba(255,255,255,0.22);
    --glass-hi: rgba(255,255,255,0.35);
    --ink: #f2f1f8;
    --ink-dim: rgba(242,241,248,0.62);
    --coral: #fb7c8c;
    --mint: #6ee7c8;
    --sun: #ffcd6b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 15% 8%, rgba(91,33,182,0.55), transparent 45%),
      radial-gradient(circle at 88% 18%, rgba(8,145,178,0.45), transparent 50%),
      radial-gradient(circle at 50% 100%, rgba(251,124,140,0.18), transparent 55%),
      var(--navy);
    overflow-x:hidden;
    position:relative;
  }
  .blob{position:fixed; border-radius:50%; filter:blur(70px); opacity:0.55; z-index:0; pointer-events:none;}
  .blob-a{width:420px; height:420px; background:var(--violet); top:-120px; left:-100px; animation: drift1 26s ease-in-out infinite;}
  .blob-b{width:380px; height:380px; background:var(--teal); bottom:-140px; right:-80px; animation: drift2 30s ease-in-out infinite;}
  @keyframes drift1{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(60px,40px);} }
  @keyframes drift2{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(-50px,-30px);} }

  .wrap{position:relative; z-index:1; max-width:1080px; margin:0 auto; padding:32px 24px 80px;}

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 26px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:22px;
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    box-shadow: 0 8px 32px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.15);
    margin-bottom:46px;
  }
  .brand{display:flex; align-items:center; gap:14px;}
  .brand img{height:32px; width:auto; display:block;}
  nav{display:flex; align-items:center; gap:22px;}
  nav a{color:var(--ink-dim); text-decoration:none; font-size:14px; font-weight:500; transition:color .2s ease;}
  nav a.active, nav a:hover{color:var(--ink);}

  .intro{padding:0 6px 30px;}
  .intro h1{
    font-family:'Fraunces',serif;
    font-size:clamp(30px,5vw,44px);
    font-weight:600;
    line-height:1.1;
    margin:0 0 10px;
  }
  .intro p{margin:0; color:var(--ink-dim); font-size:15.5px; max-width:560px; line-height:1.55;}

  .filters{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:24px;}
  .filters button{
    padding:8px 16px;
    border-radius:20px;
    border:1px solid var(--glass-border);
    background:var(--glass);
    color:var(--ink-dim);
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    transition:background .2s ease, color .2s ease;
  }
  .filters button:hover{color:var(--ink);}
  .filters button.active{background:var(--ink); color:var(--navy); border-color:var(--ink);}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px,1fr));
    gap:18px;
    margin-bottom:50px;
  }

  .product{
    position:relative;
    display:flex;
    flex-direction:column;
    border-radius:20px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.14);
    overflow:hidden;
    transition: transform .35s ease, box-shadow .35s ease;
  }
  .product:hover{ transform:translateY(-3px); box-shadow:0 16px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.18); }

  .photo{
    aspect-ratio:4/3;
    background:linear-gradient(135deg, var(--tint,rgba(255,255,255,0.12)), rgba(255,255,255,0.04));
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .photo img{width:100%; height:100%; object-fit:cover; display:block;}
  .photo svg{width:44px; height:44px; opacity:0.7;}

  .info{padding:18px 20px 20px; display:flex; flex-direction:column; gap:6px; flex:1;}
  .category{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-dim);}
  .info h3{margin:0; font-size:17px; font-weight:600;}
  .info p{margin:0; font-size:13.5px; line-height:1.5; color:var(--ink-dim);}
  .info .price{margin-top:auto; padding-top:10px; font-family:'Fraunces',serif; font-size:22px; font-weight:600;}
  .info .price small{font-family:'Inter',sans-serif; font-size:12px; font-weight:400; color:var(--ink-dim);}

  .product.soldout .photo{filter:grayscale(0.8); opacity:0.6;}
  .badge{
    position:absolute; top:14px; right:14px; z-index:1;
    font-size:11px; font-weight:600; padding:5px 10px; border-radius:20px;
    background:rgba(11,18,32,0.75); color:var(--coral);
    border:1px solid rgba(251,124,140,0.45);
  }

  .message{
    padding:40px 20px;
    text-align:center;
    color:var(--ink-dim);
    font-size:14.5px;
    grid-column:1/-1;
  }

  .skeleton{min-height:300px; background:var(--glass); border:1px solid var(--glass-border); border-radius:20px; animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.55;} 50%{opacity:.25;}}

  footer{
    text-align:center;
    color:var(--ink-dim);
    font-size:12.5px;
    margin-top:40px;
  }

  @media (max-width:600px){
    header{flex-direction:column; align-items:flex-start; gap:12px;}
  }
  @media (prefers-reduced-motion: reduce){
    .blob-a, .blob-b{ animation: none; }
    .product{ transition:none; }
    .skeleton{ animation:none; }
  }

</style>
</head>

  <div class="intro">
    <h1>Catálogo</h1>
    <p>Tarjetas NFC y códigos QR listos para tu negocio. Elige la que necesitas y escríbenos para pedirla.</p>
  </div>

  <div class="filters" id="filters"></div>
  <div class="grid" id="grid">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>

  <footer>LilGhost Studio · Pachuca de Soto, Hidalgo</footer>
</div>

<script>
  // Misma URL de Apps Script que usa inventario.html. Esta página solo LEE:
  // no necesita clave y no puede modificar nada.
  const API_URL = 'https://script.google.com/macros/s/AKfycbziha3MpQawIRihZIXKaWHlpykMcY9iVqFj5O4ZMaTEeJjX6fEhWOt0UnrQIMetrZlo/exec';

  const TINTS = ["rgba(251,124,140,0.28)","rgba(110,231,200,0.24)","rgba(255,205,107,0.24)","rgba(139,124,251,0.26)","rgba(94,196,255,0.24)"];
  const PLACEHOLDER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>';

  let products = [];
  let activeCategory = '';

  function escapeHtml(value){
    return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function formatPrice(value){
    const n = Number(value);
    return Number.isFinite(n) && n > 0 ? '$' + n.toLocaleString('es-MX') + ' <small>MXN</small>' : '';
  }

  function renderFilters(){
    const categories = [...new Set(products.map(p => String(p.category).trim()).filter(Boolean))];
    const box = document.getElementById('filters');
    if(categories.length < 2){ box.innerHTML = ''; return; }
    box.innerHTML = ['', ...categories].map(c =>
      `<button data-cat="${escapeHtml(c)}" class="${c === activeCategory ? 'active' : ''}">${c ? escapeHtml(c) : 'Todos'}</button>`
    ).join('');
    box.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
      activeCategory = btn.dataset.cat;
      renderFilters();
      renderGrid();
    }));
  }

  function renderGrid(){
    const grid = document.getElementById('grid');
    const list = products.filter(p => !activeCategory || String(p.category).trim() === activeCategory);
    if(!list.length){
      grid.innerHTML = '<div class="message">Pronto agregaremos productos aquí.</div>';
      return;
    }
    grid.innerHTML = list.map((p, i) => `
      <article class="product ${p.available ? '' : 'soldout'}" style="--tint:${TINTS[i % TINTS.length]}">
        ${p.available ? '' : '<div class="badge">Agotado</div>'}
        <div class="photo">
          ${p.photo ? `<img src="${escapeHtml(p.photo)}" alt="${escapeHtml(p.name)}" loading="lazy" referrerpolicy="no-referrer">` : PLACEHOLDER}
        </div>
        <div class="info">
          ${p.category ? `<div class="category">${escapeHtml(p.category)}</div>` : ''}
          <h3>${escapeHtml(p.name)}</h3>
          ${p.description ? `<p>${escapeHtml(p.description)}</p>` : ''}
          <div class="price">${formatPrice(p.price)}</div>
        </div>
      </article>
    `).join('');
    // Si una foto no carga (enlace roto o sin permiso), muestra el ícono.
    grid.querySelectorAll('.photo img').forEach(img => img.addEventListener('error', () => {
      img.parentElement.innerHTML = PLACEHOLDER;
    }));
  }

  async function loadCatalog(){
    try{
      const res = await fetch(`${API_URL}?action=catalog`);
      const data = await res.json();
      if(!Array.isArray(data)) throw new Error('respuesta inesperada');
      products = data;
      renderFilters();
      renderGrid();
    }catch(err){
      document.getElementById('grid').innerHTML =
        '<div class="message">No pudimos cargar el catálogo en este momento. Intenta de nuevo en unos minutos.</div>';
    }
  }

  loadCatalog();
</script>
