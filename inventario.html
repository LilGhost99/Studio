<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LilGhost Studio — Inventario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

  :root{
    --navy: #0b1220;
    --violet: #5b21b6;
    --teal: #0891b2;
    --glass: rgba(255,255,255,0.09);
    --glass-border: rgba(255,255,255,0.22);
    --glass-hi: rgba(255,255,255,0.35);
    --ink: #f2f1f8;
    --ink-dim: rgba(242,241,248,0.62);
    --coral: #fb7c8c;
    --mint: #6ee7c8;
    --sun: #ffcd6b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 15% 8%, rgba(91,33,182,0.55), transparent 45%),
      radial-gradient(circle at 88% 18%, rgba(8,145,178,0.45), transparent 50%),
      radial-gradient(circle at 50% 100%, rgba(251,124,140,0.18), transparent 55%),
      var(--navy);
    overflow-x:hidden;
    position:relative;
  }
  .blob{position:fixed; border-radius:50%; filter:blur(70px); opacity:0.55; z-index:0; pointer-events:none;}
  .blob-a{width:420px; height:420px; background:var(--violet); top:-120px; left:-100px; animation: drift1 26s ease-in-out infinite;}
  .blob-b{width:380px; height:380px; background:var(--teal); bottom:-140px; right:-80px; animation: drift2 30s ease-in-out infinite;}
  @keyframes drift1{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(60px,40px);} }
  @keyframes drift2{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(-50px,-30px);} }

  .wrap{position:relative; z-index:1; max-width:1080px; margin:0 auto; padding:32px 24px 80px;}

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 26px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:22px;
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    box-shadow: 0 8px 32px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.15);
    margin-bottom:46px;
  }
  .brand{display:flex; align-items:center; gap:14px;}
  .brand img{height:32px; width:auto; display:block;}
  nav{display:flex; align-items:center; gap:22px;}
  nav a{color:var(--ink-dim); text-decoration:none; font-size:14px; font-weight:500; transition:color .2s ease;}
  nav a.active, nav a:hover{color:var(--ink);}

  .section-title{
    font-family:'Fraunces',serif;
    font-size:20px;
    font-weight:600;
    margin: 0 0 18px;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .section-title span{font-size:13px; font-weight:400; color:var(--ink-dim); font-family:'Inter',sans-serif;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px,1fr));
    gap:18px;
    margin-bottom:50px;
  }

  .card{
    position:relative;
    border-radius:20px;
    padding:22px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.14);
    overflow:hidden;
    transition: transform .35s ease, box-shadow .35s ease;
  }
  .card::before{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(135deg, var(--tint,rgba(255,255,255,0.12)), transparent 60%);
    opacity:0.5;
    pointer-events:none;
  }
  .card:hover{ transform:translateY(-3px); box-shadow:0 16px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.18); }

  .card .icon{
    width:38px; height:38px;
    display:flex; align-items:center; justify-content:center;
    border-radius:11px;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.18);
    margin-bottom:14px;
  }
  .card .icon svg{width:20px; height:20px;}
  .card h3{margin:0 0 4px; font-size:17px; font-weight:600;}
  .card .price{font-size:13px; color:var(--ink-dim); margin-bottom:16px;}

  .stock-row{display:flex; align-items:center; justify-content:space-between; margin-top:4px;}
  .stock-count{font-family:'Fraunces',serif; font-size:30px; font-weight:600; line-height:1;}
  .stock-count.low{color:var(--coral);}
  .stock-lbl{font-size:11px; color:var(--ink-dim); margin-top:2px;}

  .stepper{display:flex; gap:8px;}
  .stepper button{
    width:32px; height:32px; border-radius:9px;
    border:1px solid var(--glass-border);
    background:rgba(255,255,255,0.10);
    color:var(--ink);
    font-size:16px;
    cursor:pointer;
    transition:background .2s ease;
  }
  .stepper button:hover{background:rgba(255,255,255,0.22);}
  .stepper button:disabled{opacity:0.4; cursor:default;}

  .badge{
    position:absolute; top:16px; right:16px;
    font-size:10.5px; padding:4px 9px; border-radius:20px;
    background:rgba(251,124,140,0.18); color:var(--coral);
    border:1px solid rgba(251,124,140,0.4);
  }

  .add-panel{
    border-radius:20px;
    padding:24px;
    background:var(--glass);
    border:1px dashed var(--glass-border);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    margin-bottom:24px;
  }
  .add-panel h3{margin:0 0 14px; font-family:'Fraunces',serif; font-size:18px; font-weight:600;}
  .add-form{display:flex; flex-wrap:wrap; gap:10px;}
  .add-form input{
    flex:1; min-width:140px;
    padding:11px 14px;
    border-radius:11px;
    border:1px solid var(--glass-border);
    background:rgba(255,255,255,0.07);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:14px;
    outline:none;
  }
  .add-form input::placeholder{color:rgba(242,241,248,0.4);}
  .add-form input:focus{border-color:var(--glass-hi);}
  .add-form button{
    padding:11px 20px;
    border-radius:11px;
    border:none;
    background:var(--ink);
    color:var(--navy);
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition:opacity .2s ease;
  }
  .add-form button:hover{opacity:0.85;}
  .add-form button:disabled{opacity:0.5; cursor:default;}

  .status-banner{
    padding:14px 18px;
    border-radius:14px;
    background:rgba(251,124,140,0.14);
    border:1px solid rgba(251,124,140,0.35);
    color:var(--ink);
    font-size:13.5px;
    margin-bottom:24px;
    display:none;
  }
  .status-banner.show{display:block;}
  .status-banner code{background:rgba(0,0,0,0.25); padding:2px 6px; border-radius:5px;}

  .del-link{
    display:block; margin-top:10px; background:none; border:none;
    color:var(--ink-dim); font-size:11.5px; text-decoration:underline;
    cursor:pointer; padding:0;
  }
  .del-link:hover{color:var(--coral);}

  .header-stat{text-align:right;}
  .header-stat .num{font-family:'Fraunces',serif; font-size:22px; font-weight:600;}
  .header-stat .lbl{font-size:11px; color:var(--ink-dim);}

  footer{
    text-align:center;
    color:var(--ink-dim);
    font-size:12.5px;
    margin-top:40px;
  }

  @media (max-width:600px){
    header{flex-direction:column; align-items:flex-start; gap:12px;}
  }
  @media (prefers-reduced-motion: reduce){
    .blob-a, .blob-b{ animation: none; }
    .card{ transition:none; }
  }

</style>
</head>

  function readKey(){
    try{ return localStorage.getItem(KEY_STORAGE) || ''; }catch(e){ return ''; }

  function saveKey(k){
    try{ k ? localStorage.setItem(KEY_STORAGE, k) : localStorage.removeItem(KEY_STORAGE); }catch(e){}

  function askKey(){

  function iconFor(name){
    const n = (name || '').toLowerCase();
    if(n.includes('reseñ') || n.includes('resen') || n.includes('google') || n.includes('maps')) return ICONS.review;
    if(n.includes('wifi') || n.includes('internet') || n.includes('clave')) return ICONS.wifi;

    if(n.includes('insta')) return ICONS.instagram;

  function setBusy(v){

    if(API_URL.includes('PEGA_AQUI')){
      showBanner('Todavía no conectaste tu Google Sheet. Sigue la guía: pega la URL de tu Apps Script en la línea <code>API_URL</code> de este archivo.');
      render();
      return;
    }
    SECRET = readKey() || askKey();
    if(!SECRET){
      showBanner('Necesitas tu clave para ver y editar el inventario. <a href="#" onclick="saveKey(\'\');loadItems();return false;" style="color:inherit">Escribir clave</a>');
      render();
      return;
    }
    setBusy(true);
    try{
      const res = await fetch(`${API_URL}?key=${encodeURIComponent(SECRET)}`);
      const data = await res.json();
      if(data.error === 'unauthorized'){
        saveKey('');
        showBanner('La clave no es correcta. <a href="#" onclick="loadItems();return false;" style="color:inherit">Intentar de nuevo</a>');
        setBusy(false);
        render();
        return;
      }
      if(data.error){ throw new Error(data.error); }
      items = data;
      showBanner(null);
    }catch(err){
      showBanner('No se pudo conectar con tu Google Sheet. Revisa que la URL y la clave (SECRET) sean correctas, y que la publicación tenga acceso "Cualquier usuario".');
    }
    setBusy(false);
    render();
  }

  async function callApi(payload){
    setBusy(true);
    try{
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita preflight con Apps Script
        body: JSON.stringify({ ...payload, key: SECRET })
      });
      const data = await res.json();
      if(data.error) throw new Error(data.error);
      items = data;
      showBanner(null);
    }catch(err){
      showBanner('Hubo un problema guardando el cambio. Vuelve a intentar en un momento.');
    }
    setBusy(false);
    render();
  }

  function render(){
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    let total = 0;
    items.forEach((item, i) => {
      total += Number(item.stock) || 0;
      const tint = TINTS[i % TINTS.length];
      const low = Number(item.stock) <= 3;
      const card = document.createElement('div');
      card.className = 'card';
      card.style.setProperty('--tint', tint);
      card.innerHTML = `
        ${low ? '<div class="badge">Stock bajo</div>' : ''}
        <div class="icon">${iconFor(item.name)}</div>
        <h3>${item.name}</h3>
        <div class="price">$${Number(item.price).toLocaleString('es-MX')} MXN</div>
        <div class="stock-row">
          <div>
            <div class="stock-count ${low ? 'low' : ''}">${item.stock}</div>
            <div class="stock-lbl">disponibles</div>
          </div>
          <div class="stepper">
            <button onclick="changeStock('${item.id}', -1)">−</button>
            <button onclick="changeStock('${item.id}', 1)">+</button>
          </div>
        </div>
        <button class="del-link" onclick="removeItem('${item.id}')">Eliminar producto</button>
      `;
      grid.appendChild(card);
    });
    document.getElementById('totalUnits').textContent = items.length ? total : '—';
    document.getElementById('itemCountLbl').textContent = items.length + (items.length === 1 ? ' tipo' : ' tipos');
  }

  function changeStock(id, delta){
    if(busy) return;
    const item = items.find(it => String(it.id) === String(id));
    if(!item) return;
    item.stock = Math.max(0, Number(item.stock) + delta);
    callApi({ action:'update', item });
  }

  function removeItem(id){
    if(busy) return;
    if(!confirm('¿Eliminar este producto del inventario?')) return;
    callApi({ action:'delete', item:{ id } });
  }

  function addItem(){
    if(busy) return;
    const nameInput = document.getElementById('newName');
    const priceInput = document.getElementById('newPrice');
    const stockInput = document.getElementById('newStock');
    const name = nameInput.value.trim();
    if(!name) return;
    const price = Number(priceInput.value) || 0;
    const stock = Number(stockInput.value) || 0;
    const id = name.toLowerCase().replace(/[^a-z0-9]+/g,'-') + '-' + Date.now();
    callApi({ action:'add', item:{ id, name, price, stock } }).then(() => {
      nameInput.value=''; priceInput.value=''; stockInput.value='';
    });
  }

  loadItems();
</script>

</body>
</html>
