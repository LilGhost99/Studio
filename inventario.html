<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="img/fantasma.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<title>LilGhost Studio — Inventario</title>
<meta name="robots" content="noindex">

<style>
  .intro{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:30px;}
  .intro h1{font-size:clamp(42px,7vw,72px);}
  .intro .hand{font-size:24px; color:var(--red); display:inline-block; transform:rotate(-3deg);}
  .stat{padding:14px 22px; text-align:center; background:var(--yellow-soft); transform:rotate(2deg);}
  .stat .num{font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:38px; line-height:1;}
  .stat .lbl{font-size:13px; font-weight:700;}

  .section-title{display:flex; align-items:baseline; gap:10px; margin:0 0 18px; font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:26px;}
  .section-title span{font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; color:var(--ink-soft);}

  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:22px; margin-bottom:50px;}
  .card{position:relative; padding:22px; background:var(--paper); border:var(--border); border-radius:var(--radius); box-shadow:var(--shadow);}
  .card .icon{
    width:46px; height:46px;
    display:flex; align-items:center; justify-content:center;
    background:var(--tint, var(--yellow-soft));
    border:var(--border); border-radius:12px;
    margin-bottom:14px;
  }
  .card .icon svg{width:22px; height:22px;}
  .card h3{margin:0 0 4px; font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:20px;}
  .card .price{font-size:14px; font-weight:700; color:var(--ink-soft); margin-bottom:16px;}

  .stock-row{display:flex; align-items:center; justify-content:space-between;}
  .stock-count{font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:36px; line-height:1;}
  .stock-count.low{color:var(--red);}
  .stock-lbl{font-size:12px; font-weight:700; color:var(--ink-soft); margin-top:2px;}
  .stepper{display:flex; gap:8px;}
  .stepper button{
    width:40px; height:40px;
    border:var(--border); border-radius:12px;
    background:var(--paper); color:var(--ink);
    font-size:20px; font-weight:700;
    box-shadow:var(--shadow-sm);
    cursor:pointer;
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .stepper button:hover{background:var(--yellow-soft);}
  .stepper button:active{transform:translate(3px,3px); box-shadow:none;}
  .stepper button:disabled{opacity:.4; cursor:default;}

  .badge{
    position:absolute; top:16px; right:14px;
    font-size:12px; font-weight:700;
    padding:4px 10px;
    background:var(--red); color:#fff;
    border:2.5px solid var(--ink); border-radius:8px;
    transform:rotate(4deg);
  }

  .del-link{display:block; margin-top:14px; padding:0; background:none; border:none; color:var(--ink-soft); font-family:inherit; font-size:13px; font-weight:500; text-decoration:underline; cursor:pointer;}
  .del-link:hover{color:var(--red);}

  .add-panel{padding:24px; border-style:dashed;}
  .add-form{display:flex; flex-wrap:wrap; gap:12px;}
  .add-form input{
    flex:1; min-width:150px;
    padding:12px 14px;
    border:var(--border); border-radius:12px;
    background:var(--paper); color:var(--ink);
    font-family:inherit; font-size:15px;
    outline:none;
  }
  .add-form input:focus{background:var(--yellow-soft);}
</style>
</head>
<body>

<div class="wrap">

  <header class="site-header">
    <a class="brand" href="index.html"><img src="img/logo.png" alt="LilGhost Studio"></a>
    <nav class="site-nav">
      <a href="index.html">Inicio</a>
      <a href="catalogo.html">Catálogo</a>
      <a href="inventario.html" class="active">Inventario</a>
    </nav>
  </header>

  <section class="intro">
    <div>
      <span class="hand">solo para ti 👻</span>
      <h1 class="display">Inventario</h1>
    </div>
    <div class="stat sticker">
      <div class="num" id="totalUnits">—</div>
      <div class="lbl">unidades en stock</div>
    </div>
  </section>

  <div id="statusBanner" class="status-banner"></div>

  <div class="section-title">Productos <span id="itemCountLbl"></span></div>
  <div class="grid" id="grid"></div>

  <div class="section-title">Agregar producto nuevo</div>
  <div class="add-panel sticker">
    <div class="add-form">
      <input type="text" id="newName" placeholder="Nombre (ej. TikTok, Facebook...)">
      <input type="number" id="newPrice" placeholder="Precio MXN" min="0">
      <input type="number" id="newStock" placeholder="Stock inicial" min="0">
      <button class="btn btn-yellow" id="addBtn" onclick="addItem()">Agregar</button>
    </div>
  </div>

  <footer class="site-footer">
    <img src="img/logo.png" alt="LilGhost Studio">
    <div class="links">
      <a href="index.html">Inicio</a>
      <a href="https://www.instagram.com/lilghost.studio/" target="_blank" rel="noopener">Instagram</a>
      <a href="https://wa.me/527711948929" target="_blank" rel="noopener">WhatsApp</a>
    </div>
    <small>Pachuca de Soto, Hidalgo</small>
  </footer>
</div>

<script>
  // ---- CONFIGURA ESTO con los datos de tu Apps Script (paso 5 de la guía) ----
  const API_URL = 'https://script.google.com/macros/s/AKfycbziha3MpQawIRihZIXKaWHlpykMcY9iVqFj5O4ZMaTEeJjX6fEhWOt0UnrQIMetrZlo/exec';
  // ---------------------------------------------------------------------------

  // La clave NO se escribe aquí (cualquiera podría verla en el código fuente).
  // La página la pide una vez y la recuerda solo en este dispositivo.
  const KEY_STORAGE = 'lilghost-inventario-key';
  let SECRET = '';

  function readKey(){
    try{ return localStorage.getItem(KEY_STORAGE) || ''; }catch(e){ return ''; }
  }
  function saveKey(k){
    try{ k ? localStorage.setItem(KEY_STORAGE, k) : localStorage.removeItem(KEY_STORAGE); }catch(e){}
  }
  function askKey(){
    const k = (prompt('Escribe tu clave de inventario:') || '').trim();
    saveKey(k);
    return k;
  }

  const ICONS = {
    review: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 17.3l-6.2 3.6 1.6-7-5.4-4.7 7.1-.6L12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7z"/></svg>',
    wifi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 8.5a16 16 0 0 1 20 0"/><path d="M5 12.5a11 11 0 0 1 14 0"/><path d="M8.5 16.3a6 6 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1" fill="currentColor" stroke="none"/></svg>',
    whatsapp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.6-4.8A8.5 8.5 0 1 1 8.7 19L3 21z"/><path d="M8.5 9.5c.3 2.5 2.5 4.7 5 5"/></svg>',
    instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none"/></svg>',
    transfer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10h13l-4-4"/><path d="M17 14H4l4 4"/></svg>',
    generic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>'
  };
  const TINTS = ["#FFE27A","#BFD7FF","#FFC2DC","#BDEBC8","#FFC9BF"];

  function iconFor(name){
    const n = (name || '').toLowerCase();
    if(n.includes('reseñ') || n.includes('resen') || n.includes('google') || n.includes('maps')) return ICONS.review;
    if(n.includes('wifi') || n.includes('internet') || n.includes('clave')) return ICONS.wifi;
    if(n.includes('whats')) return ICONS.whatsapp;
    if(n.includes('insta')) return ICONS.instagram;
    if(n.includes('transfer') || n.includes('pago') || n.includes('clabe')) return ICONS.transfer;
    return ICONS.generic;
  }

  let items = [];
  let busy = false;

  function showBanner(msg){
    const b = document.getElementById('statusBanner');
    if(!msg){ b.classList.remove('show'); return; }
    b.innerHTML = msg;
    b.classList.add('show');
  }

  function setBusy(v){
    busy = v;
    document.querySelectorAll('.stepper button, #addBtn').forEach(el => el.disabled = v);
  }

  async function loadItems(){
    if(API_URL.includes('PEGA_AQUI')){
      showBanner('Todavía no conectaste tu Google Sheet. Sigue la guía: pega la URL de tu Apps Script en la línea <code>API_URL</code> de este archivo.');
      render();
      return;
    }
    SECRET = readKey() || askKey();
    if(!SECRET){
      showBanner('Necesitas tu clave para ver y editar el inventario. <a href="#" onclick="saveKey(\'\');loadItems();return false;" style="color:inherit">Escribir clave</a>');
      render();
      return;
    }
    setBusy(true);
    try{
      const res = await fetch(`${API_URL}?key=${encodeURIComponent(SECRET)}`);
      const data = await res.json();
      if(data.error === 'unauthorized'){
        saveKey('');
        showBanner('La clave no es correcta. <a href="#" onclick="loadItems();return false;" style="color:inherit">Intentar de nuevo</a>');
        setBusy(false);
        render();
        return;
      }
      if(data.error){ throw new Error(data.error); }
      items = data;
      showBanner(null);
    }catch(err){
      showBanner('No se pudo conectar con tu Google Sheet. Revisa que la URL y la clave (SECRET) sean correctas, y que la publicación tenga acceso "Cualquier usuario".');
    }
    setBusy(false);
    render();
  }

  async function callApi(payload){
    setBusy(true);
    try{
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita preflight con Apps Script
        body: JSON.stringify({ ...payload, key: SECRET })
      });
      const data = await res.json();
      if(data.error) throw new Error(data.error);
      items = data;
      showBanner(null);
    }catch(err){
      showBanner('Hubo un problema guardando el cambio. Vuelve a intentar en un momento.');
    }
    setBusy(false);
    render();
  }

  function render(){
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    let total = 0;
    items.forEach((item, i) => {
      total += Number(item.stock) || 0;
      const tint = TINTS[i % TINTS.length];
      const low = Number(item.stock) <= 3;
      const card = document.createElement('div');
      card.className = 'card';
      card.style.setProperty('--tint', tint);
      card.innerHTML = `
        ${low ? '<div class="badge">Stock bajo</div>' : ''}
        <div class="icon">${iconFor(item.name)}</div>
        <h3>${item.name}</h3>
        <div class="price">$${Number(item.price).toLocaleString('es-MX')} MXN</div>
        <div class="stock-row">
          <div>
            <div class="stock-count ${low ? 'low' : ''}">${item.stock}</div>
            <div class="stock-lbl">disponibles</div>
          </div>
          <div class="stepper">
            <button onclick="changeStock('${item.id}', -1)">−</button>
            <button onclick="changeStock('${item.id}', 1)">+</button>
          </div>
        </div>
        <button class="del-link" onclick="removeItem('${item.id}')">Eliminar producto</button>
      `;
      grid.appendChild(card);
    });
    document.getElementById('totalUnits').textContent = items.length ? total : '—';
    document.getElementById('itemCountLbl').textContent = items.length + (items.length === 1 ? ' tipo' : ' tipos');
  }

  function changeStock(id, delta){
    if(busy) return;
    const item = items.find(it => String(it.id) === String(id));
    if(!item) return;
    item.stock = Math.max(0, Number(item.stock) + delta);
    callApi({ action:'update', item });
  }

  function removeItem(id){
    if(busy) return;
    if(!confirm('¿Eliminar este producto del inventario?')) return;
    callApi({ action:'delete', item:{ id } });
  }

  function addItem(){
    if(busy) return;
    const nameInput = document.getElementById('newName');
    const priceInput = document.getElementById('newPrice');
    const stockInput = document.getElementById('newStock');
    const name = nameInput.value.trim();
    if(!name) return;
    const price = Number(priceInput.value) || 0;
    const stock = Number(stockInput.value) || 0;
    const id = name.toLowerCase().replace(/[^a-z0-9]+/g,'-') + '-' + Date.now();
    callApi({ action:'add', item:{ id, name, price, stock } }).then(() => {
      nameInput.value=''; priceInput.value=''; stockInput.value='';
    });
  }

  loadItems();
</script>


</body>
</html>
